<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Insert Student</title>
   <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ACB6E5, #74ebd5);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-container {
      background: #fff;
      padding: 25px 35px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      width: 360px;
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #333;
      margin-bottom: 18px;
      font-size: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 600;
      margin-bottom: 4px;
      color: #444;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #007bff;
      outline: none;
    }

    button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      width: 100%;
    }

    button:hover {
      background-color: #0056b3;
      transform: scale(1.03);
    }

    p {
      color: green;
      font-weight: bold;
      font-size: 14px;
      margin-top: 10px;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      color: #007bff;
      font-weight: 600;
      font-size: 14px;
    }

    a:hover {
      color: #0056b3;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="form-container">
<h2>Insert Student Data</h2>

<form th:action="@{/student/save}" th:object="${student}" method="post">
  <label>Name:</label>
  <input type="text" th:field="*{name}" pattern="[A-Za-z ]+" title="Only alphabets allowed" required><br><br>

  <label>Age:</label>
  <input type="number" th:field="*{age}" required><br><br>

  <label>Branch:</label>
  <input type="text" th:field="*{branch}"  pattern="[A-Za-z ]+" title="Only alphabets allowed" required><br><br>

  <label>Email:</label>
  <input type="email" th:field="*{email}" required><br><br>

  <label>Password:</label>
  <input type="password" th:field="*{password}" required><br><br>

  <button type="submit">Submit</button>
</form>

<p th:text="${message}" style="color:green;"></p>

<br><a href="/admin/dashboard"> Back to Dashboard</a>
</div>
</body>
</html>
